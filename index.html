<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Hub de Apps</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte moderna do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Efeitos de luz ao fundo (Glassmorphism) -->
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Tela de Login -->
    <main id="login-section" class="glass-container active">
        <div class="login-box">
            <div class="logo-icon">🚀</div>
            <h2>Bem-vindo</h2>
            <p>Faça login para acessar suas automações.</p>
            <button id="login-btn" class="glass-button primary">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="google-icon">
                Entrar com Google
            </button>
        </div>
    </main>

    <!-- Painel com os Cards (Dashboard) -->
    <main id="dashboard-section" class="hidden">
        <header class="glass-header">
            <div>
                <h2>Meus Apps</h2>
                <p>Selecione um projeto</p>
            </div>
            <button id="logout-btn" class="glass-button small">Sair</button>
        </header>

        <div class="cards-grid">
            <!-- Card 1 -->
            <div class="glass-card">
                <div class="card-content">
                    <div class="icon">📊</div>
                    <h3>Financeiro</h3>
                    <p>Dashboard e controle de planilhas.</p>
                </div>
                <div class="card-action">
                    <button class="glass-button full">Acessar App</button>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="glass-card">
                <div class="card-content">
                    <div class="icon">📝</div>
                    <h3>Cadastro Clientes</h3>
                    <p>Gerencie contatos no App Script.</p>
                </div>
                <div class="card-action">
                    <button class="glass-button full">Acessar App</button>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="glass-card">
                <div class="card-content">
                    <div class="icon">📦</div>
                    <h3>Estoque</h3>
                    <p>Verificar fluxo de materiais.</p>
                </div>
                <div class="card-action">
                    <button class="glass-button full">Acessar App</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
